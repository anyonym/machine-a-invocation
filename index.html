<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📜 Nevercode 🪄</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="bienvenue">
      <p>
        ✨ Bienvenue à toi que le destin a guidé jusqu'ici ! Cette machine à
        invocation apparaît et se matérialise au gré des requêtes de ton
        navigateur, spécialement à ton attention ... ✨
      </p>
    </header>
    
    <main>
      <section id="formulaire">
        <h1>📜 Nevercode 🪄</h1>
        <form id="invocation">
          <label for="prenom">✨ Quel est ton prénom ?</label>
          <input id="prenom" type="text" placeholder="Ton prénom..." required />

          <label for="creature"
            >🔮 A quelle créature formuler ta demande ?</label
          >
          <select id="creature">
            <option value="">Choisis ta créature...</option>
            <option value="Le Phénix">🐦‍🔥 Le Phénix</option>
            <option value="Le Dragon">🐉 Le Dragon</option>
            <option value="La Licorne">🦄 La Licorne</option>
            <option value="Le Corbeau">🐦‍⬛ Le Corbeau</option>
          </select>

          <button type="submit">✧ Révélation ✧</button>
        </form>
      </section>

      <section id="resultat" class="cache">
        <p id="message"></p>
        <button id="recommencer" type="button">✧ Une autre demande ? ✧</button>
      </section>
    </main>
    
    <footer>
      <p>© YE 2026</p>
    </footer>
  </body>
</html>
